<body>
  <div id="gate" class="locked">
    <div class="gate">
      <div class="logo">CONEXÃO <span>CRM.</span></div>
      <h1>Prévia interna do Prêmio Conexão CRM 2027</h1>
      <p id="gateCopy">Validando seu acesso de administração…</p>
      <div class="status" id="gateStatus">Aguarde alguns segundos.</div>
      <p style="margin-top:20px"><a href="/">Voltar para o Conexão CRM</a></p>
    </div>
  </div>
  <div id="app" hidden></div>
  <script>
    (async()=>{
      const URL="https://rwkbpafpniwzvlkfngag.supabase.co";
      const KEY="sb_publishable_41a2jzlzwZgFrdMJ6UpDXQ_jysf69_C";
      const gate=document.getElementById("gate"),app=document.getElementById("app"),copy=document.getElementById("gateCopy"),status=document.getElementById("gateStatus");
      try{
        if(!window.supabase?.createClient)throw new Error("Cliente de autenticação indisponível.");
        const sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
        const {data:{session},error}=await sb.auth.getSession();
        if(error)throw error;
        if(!session){
          copy.textContent="Esta página ainda não está pública.";
          status.textContent="Entre no Conexão CRM com uma conta de administração e depois abra novamente esta URL.";
          return;
        }
        const res=await fetch(URL+"/functions/v1/crm-internal-awards-preview",{
          method:"POST",
          headers:{"Authorization":"Bearer "+session.access_token,"apikey":KEY,"Content-Type":"application/json"},
          body:"{}",
          cache:"no-store"
        });
        let payload={};try{payload=await res.json()}catch{}
        if(!res.ok||!payload.html){
          copy.textContent="Esta página ainda não está pública.";
          status.textContent=payload.error||"Seu acesso não foi autorizado para esta prévia.";
          return;
        }
        app.innerHTML=payload.html;
        app.hidden=false;
        gate.remove();
      }catch(err){
        copy.textContent="Não foi possível abrir a prévia.";
        status.textContent=err?.message||"Tente atualizar a página.";
      }
    })();
  </script>
