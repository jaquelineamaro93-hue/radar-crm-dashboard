name: Help center bell and sidebar regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/crm-help-workspace.*'
      - 'assets/push-preferences.js'
      - 'assets/help-center*'
      - 'ajuda/**'
      - 'boas-praticas/**'
      - 'novidades/**'
      - 'painel/ajuda/**'
      - 'painel/boas-praticas/**'
      - 'painel/novidades/**'
      - 'tests/help-bell-sidebar.cjs'
  push:
    branches: [main]
    paths:
      - 'assets/crm-help-workspace.*'
      - 'assets/push-preferences.js'
      - 'assets/help-center*'
      - 'ajuda/**'
      - 'boas-praticas/**'
      - 'novidades/**'
      - 'painel/ajuda/**'
      - 'painel/boas-praticas/**'
      - 'painel/novidades/**'
      - 'tests/help-bell-sidebar.cjs'
permissions:
  contents: read
jobs:
  help-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - run: node tests/help-bell-sidebar.cjs
