name: Help center bell and sidebar regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/crm-help-workspace.*'
      - 'assets/push-preferences.js'
      - 'assets/help-center*'
      - 'assets/help-guides.js'
      - 'ajuda/**'
      - 'boas-praticas/**'
      - 'novidades/**'
      - 'painel/ajuda/**'
      - 'painel/boas-praticas/**'
      - 'painel/novidades/**'
      - 'tests/help-bell-sidebar.cjs'
      - 'tests/help-guide-reader.cjs'
      - 'tests/feedback-sidebar-email.cjs'
      - 'tests/figma-unified-pages-static.cjs'
      - 'tests/saved-jobs-figma.cjs'
      - 'assets/saved-jobs-figma.*'
      - 'assets/conexao-figma-unified-pages.css'
      - 'tests/help-watermark-language-footer.cjs'
      - '.github/workflows/help-bell-sidebar.yml'
  push:
    branches: [main]
    paths:
      - 'assets/crm-help-workspace.*'
      - 'assets/push-preferences.js'
      - 'assets/help-center*'
      - 'assets/help-guides.js'
      - 'ajuda/**'
      - 'boas-praticas/**'
      - 'novidades/**'
      - 'painel/ajuda/**'
      - 'painel/boas-praticas/**'
      - 'painel/novidades/**'
      - 'tests/help-bell-sidebar.cjs'
      - 'tests/help-guide-reader.cjs'
      - '.github/workflows/help-bell-sidebar.yml'
permissions:
  contents: read
jobs:
  help-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - run: node tests/help-bell-sidebar.cjs
      - run: node tests/feedback-sidebar-email.cjs
      - name: Install isolated DOM test dependency
        run: npm install --prefix "$RUNNER_TEMP/crm-help-dom" jsdom@26.1.0 --ignore-scripts --no-audit --no-fund
      - name: Verify language control and email credits
        run: NODE_PATH="$RUNNER_TEMP/crm-help-dom/node_modules" node tests/help-watermark-language-footer.cjs
      - name: Check Figma Saved Jobs markup and automatic real Match
        run: node --test tests/figma-unified-pages-static.cjs
      - name: Verify Saved Jobs design without mock data
        run: NODE_PATH="$RUNNER_TEMP/crm-help-dom/node_modules" node --test tests/saved-jobs-figma.cjs
      - name: Verify complete guide reader in three languages
        run: NODE_PATH="$RUNNER_TEMP/crm-help-dom/node_modules" node tests/help-guide-reader.cjs
