name: Diagnostico seguro da chave Inngage
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  key-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Classificar credencial sem divulgar valor
        env:
          CHECK_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, base64
          key = os.environ.get("CHECK_KEY", "")
          result = {"present": bool(key), "surrounding_whitespace": key != key.strip()}
          if key.startswith("sb_secret_"):
              result["type"] = "secret_api_key"
          elif key.startswith("sb_publishable_"):
              result["type"] = "publishable_api_key"
          elif key.count(".") == 2:
              result["type"] = "jwt"
              try:
                  part = key.split(".")[1]
                  data = json.loads(base64.urlsafe_b64decode(part + "=" * (-len(part) % 4)))
                  result["service_role_claim"] = data.get("role") == "service_role"
                  result["anon_role_claim"] = data.get("role") == "anon"
                  result["expected_project_claim"] = data.get("ref") == "rwkbpafpniwzvlkfngag"
                  result["claims_are_not_signature_verification"] = True
              except Exception:
                  result["jwt_payload_readable"] = False
          else:
              result["type"] = "unrecognized"
          import urllib.request, urllib.error
          if result.get("service_role_claim") and result.get("expected_project_claim"):
              req = urllib.request.Request("https://rwkbpafpniwzvlkfngag.supabase.co/auth/v1/admin/users?page=1&per_page=1", headers={"apikey": key, "Authorization": "Bearer " + key})
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      result["supabase_admin_http"] = response.status
              except urllib.error.HTTPError as error:
                  result["supabase_admin_http"] = error.code
              except Exception:
                  result["supabase_admin_network_error"] = True
          print(json.dumps(result))
          PY
