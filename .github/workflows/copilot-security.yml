name: Copilot privacy and safety

on:
  push:
    branches:
      - main
      - feature/conexao-ia-copiloto-seguro-20261020
    paths:
      - 'assets/crm-copilot.js'
      - 'assets/crm-copilot.css'
      - 'assets/brasa-clean-20261026.css'
      - 'supabase/functions/brasa-copilot/**'
      - 'tests/brasa-dialogue-20261026.mjs'
      - 'assets/crm-runtime-integrations.js'
      - 'tests/copilot-security.cjs'
      - 'privacy-policy.html'
      - '.github/workflows/copilot-security.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'assets/crm-copilot.js'
      - 'assets/crm-copilot.css'
      - 'assets/brasa-clean-20261026.css'
      - 'supabase/functions/brasa-copilot/**'
      - 'tests/brasa-dialogue-20261026.mjs'
      - 'assets/crm-runtime-integrations.js'
      - 'tests/copilot-security.cjs'
      - 'privacy-policy.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copilot-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Validate JS syntax, privacy boundaries and intent routing
        run: node tests/copilot-security.cjs

      - name: Validate transparent errors and retry
        run: node tests/brasa-service-fallback.cjs

      - name: Validate Brasa content-sized layout and context
        run: node tests/brasa-natural-ui.cjs

      - name: Validate Jev routing and fail-closed model gate
        run: node tests/brasa-engine.mjs

      - name: Validate 18 conversational examples, privacy and clean UI
        run: node tests/brasa-dialogue-20261026.mjs

      - name: Install isolated DOM test runtime
        run: npm install --prefix "$RUNNER_TEMP/brasa-dom" happy-dom@20.8.4 --ignore-scripts --no-audit --no-fund

      - name: Validate Brasa workspace and account isolation
        run: HAPPY_DOM_MODULE="$RUNNER_TEMP/brasa-dom/node_modules/happy-dom/lib/index.js" node tests/brasa-workspace.cjs
