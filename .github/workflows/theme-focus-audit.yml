name: Visual theme and cache audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - '**/index.html'
      - 'assets/*.css'
      - 'assets/crm-runtime-integrations.js'
      - 'assets/google-login.js'
      - 'tests/theme-focus-audit.cjs'
      - '.github/workflows/theme-focus-audit.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - '**/index.html'
      - 'assets/*.css'
      - 'assets/crm-runtime-integrations.js'
      - 'assets/google-login.js'
      - 'tests/theme-focus-audit.cjs'
      - '.github/workflows/theme-focus-audit.yml'
permissions:
  contents: read
jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - run: node tests/theme-focus-audit.cjs
      - run: node tests/portal-shell-route-sync.cjs
      - run: node tests/first-paint-layout.cjs
      - run: node tests/clean-route-restoration.cjs
