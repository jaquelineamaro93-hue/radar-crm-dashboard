name: Web Push device opt-in
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  opt-in:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - run: npm install --prefix "$RUNNER_TEMP/crm-webpush" happy-dom@20.8.4 --ignore-scripts --no-audit --no-fund
      - run: HAPPY_DOM_MODULE="$RUNNER_TEMP/crm-webpush/node_modules/happy-dom/lib/index.js" node tests/webpush-optin.cjs
      - run: HAPPY_DOM_MODULE="$RUNNER_TEMP/crm-webpush/node_modules/happy-dom/lib/index.js" node tests/otw-public-registration.cjs
      - run: node tests/otw-required-webpush.cjs
      - run: node tests/help-bell-sidebar.cjs
