name: Trends report and source catalog
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - run: npm install --prefix "$RUNNER_TEMP/crm-report" happy-dom@20.8.4 --ignore-scripts --no-audit --no-fund
      - run: HAPPY_DOM_MODULE="$RUNNER_TEMP/crm-report/node_modules/happy-dom/lib/index.js" node tests/trends-report.cjs
      - run: HAPPY_DOM_MODULE="$RUNNER_TEMP/crm-report/node_modules/happy-dom/lib/index.js" node tests/implementation-report.cjs
      - run: HAPPY_DOM_MODULE="$RUNNER_TEMP/crm-report/node_modules/happy-dom/lib/index.js" node tests/implementation-report-workspace.cjs
      - run: node tests/portal-quality.cjs
      - run: node tests/catalog-pages-clean.cjs
