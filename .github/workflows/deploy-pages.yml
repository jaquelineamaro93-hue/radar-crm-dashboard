name: Portal quality checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Portal quality gate
        run: |
          node tests/portal-quality.cjs
          node tests/radar-filter-regression.cjs
          node tests/match-scope-relevance.cjs
          node --test tests/new-member-goals-onboarding.cjs
          node tests/catalog-pages-clean.cjs
          node tests/first-paint-layout.cjs
          node tests/unified-directory-shell.cjs
          node tests/radar-groups-visual-consistency.cjs
          node tests/freelancer-card-a.cjs
          node tests/freelancer-directory-order-20261027.cjs
          node tests/workspace-studio-spacing.cjs
          node tests/saved-jobs-unsave.cjs
          node tests/header-ui-kit.cjs
          node tests/profile-hub-unified.cjs
          node tests/match-resume-file-reader.cjs
          node tests/profile-modal-unified.cjs
          node tests/events-chronology.cjs
          node tests/community-jobs-isolation.cjs
          node tests/share-preview-ui.cjs
          node tests/experience-feedback-ui.cjs
          node tests/otw-required-webpush.cjs
