<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conexão CRM - Diretório & Hub</title>
  <!-- Tailwind CSS para estilização moderna e responsiva -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center">
      <h1 class="text-2xl font-bold tracking-tight">Conexão CRM Hub</h1>
      <p class="text-indigo-200 text-sm mt-1 md:mt-0">Networking, MarTech e Comunidade</p>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full grid grid-cols-1 md:grid-cols-3 gap-8">
    
    <!-- Formulário de Cadastro -->
    <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 md:col-span-1 h-fit">
      <h2 class="text-lg font-semibold text-slate-900 mb-4">Cadastre seu Perfil</h2>
      
      <form id="formPerfil" onsubmit="event.preventDefault(); salvarPerfilNoSupabase();" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Nome Completo *</label>
          <input type="text" id="comCadNome" required class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">E-mail (Único) *</label>
          <input type="email" id="comCadEmail" required class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="seu@email.com">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Área de Atuação *</label>
          <input type="text" id="comCadArea" required placeholder="Ex: CRM, CX, Data..." class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Senioridade</label>
          <select id="comCadSenioridade" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
            <option value="Júnior">Júnior</option>
            <option value="Pleno">Pleno</option>
            <option value="Sênior">Sênior</option>
            <option value="Liderança / C-Level">Liderança / C-Level</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Ferramentas (MarTech)</label>
          <input type="text" id="comCadFerramentas" placeholder="Ex: Salesforce, RD Station, HubSpot" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">LinkedIn (URL)</label>
          <input type="url" id="comCadLinkedin" placeholder="https://linkedin.com/in/seu-perfil" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition-colors text-sm shadow-sm">
          Salvar Perfil
        </button>
      </form>
    </section>

    <!-- Listagem / Diretório -->
    <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 md:col-span-2">
      <div class="flex justify-between items-center mb-4">
        <div>
          <h2 class="text-lg font-semibold text-slate-900">Membros da Comunidade</h2>
          <p id="totalMembros" class="text-xs text-slate-500">Carregando estatísticas...</p>
        </div>
        <button onclick="carregarMembros()" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium underline">Atualizar Lista</button>
      </div>

      <div id="listaMembros" class="space-y-3">
        <p class="text-sm text-slate-500 italic">Carregando membros cadastrados...</p>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 mt-12 py-4 text-center text-xs text-slate-500">
    Conexão CRM &copy; 2026 - Todos os direitos reservados.
  </footer>

  <!-- Lógica da Aplicação, Blindagem e Supabase -->
  <script>
    // Configuração do Supabase (Insira suas chaves reais do projeto aqui)
    const SUPABASE_URL = 'SUA_SUPABASE_URL_AQUI';
    const SUPABASE_ANON_KEY = 'SUA_SUPABASE_ANON_KEY_AQUI';

    const { createClient } = window.supabase;
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Função de Sanitização contra XSS e injeções
    function sanitizeInput(s, maxLen) {
      if (!s) return '';
      maxLen = maxLen || 500;
      return s.toString()
        .replace(/<[^>]*>/g, '')         // Remove tags HTML
        .replace(/javascript:/gi, '')     // Remove protocolos maliciosos
        .replace(/on\w+\s*=/gi, '')      // Remove event handlers inline
        .replace(/script/gi, '')          // Remove a palavra script
        .trim()
        .slice(0, maxLen);
    }

    // Validação de formato de E-mail
    function validarEmail(email) {
      const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return re.test(email);
    }

    // Função para salvar no Supabase de forma segura
    async function salvarPerfilNoSupabase() {
      const emailInput = sanitizeInput(document.getElementById('comCadEmail').value, 150);
      
      if (!validarEmail(emailInput)) {
        alert('Por favor, insira um e-mail válido.');
        return;
      }

      const perfil = {
        nome: sanitizeInput(document.getElementById('comCadNome').value, 80),
        email: emailInput,
        area: sanitizeInput(document.getElementById('comCadArea').value, 100),
        senioridade: sanitizeInput(document.getElementById('comCadSenioridade').value, 40),
        ferramentas: sanitizeInput(document.getElementById('comCadFerramentas').value, 200),
        linkedin: sanitizeInput(document.getElementById('comCadLinkedin').value, 300),
        created_at: new Date().toISOString()
      };

      if (!perfil.nome || !perfil.area) {
        alert('Por favor, preencha os campos obrigatórios.');
        return;
      }

      try {
        const { error } = await supabase
          .from('diretorio_membros')
          .insert([perfil]);

        if (error) {
          if (error.code === '23505') {
            alert('Este e-mail já está cadastrado no diretório.');
            return;
          }
          throw error;
        }

        alert('Perfil cadastrado com sucesso!');
        document.getElementById('formPerfil').reset();
        carregarMembros();
      } catch (err) {
        console.error('Erro ao salvar no Supabase:', err.message);
        alert('Erro ao salvar os dados. Verifique sua conexão ou configuração do Supabase.');
      }
    }

    // Função para carregar os membros do Supabase para a tela
    async function carregarMembros() {
      const container = document.getElementById('listaMembros');
      const totalCounter = document.getElementById('totalMembros');
      
      try {
        const { data, error, count } = await supabase
          .from('diretorio_membros')
          .select('*', { count: 'exact' })
          .order('created_at', { ascending: false });

        if (error) throw error;

        totalCounter.textContent = `${count || 0} membro(s) cadastrado(s)`;

        if (!data || data.length === 0) {
          container.innerHTML = '<p class="text-sm text-slate-500 italic">Nenhum membro cadastrado ainda. Seja o primeiro!</p>';
          return;
        }

        container.innerHTML = data.map(m => `
          <div class="p-3 border border-slate-100 bg-slate-50 rounded-lg flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
            <div>
              <h3 class="text-sm font-semibold text-slate-800">${escapeHtml(m.nome)}</h3>
              <p class="text-xs text-slate-600">${escapeHtml(m.area)} &bull; <span class="text-indigo-600 font-medium">${escapeHtml(m.senioridade || '')}</span></p>
              ${m.ferramentas ? `<p class="text-xs text-slate-500 mt-1">Stack: ${escapeHtml(m.ferramentas)}</p>` : ''}
            </div>
            ${m.linkedin ? `<a href="${escapeHtml(m.linkedin)}" target="_blank" rel="noopener noreferrer" class="text-xs bg-indigo-50 text-indigo-700 border border-indigo-200 px-3 py-1 rounded-md hover:bg-indigo-100 transition-colors">LinkedIn</a>` : ''}
          </div>
        `).join('');

      } catch (err) {
        console.error('Erro ao carregar:', err.message);
        container.innerHTML = '<p class="text-sm text-red-500">Erro ao carregar a lista de membros.</p>';
      }
    }

    // Auxiliar extra para garantir escape seguro no HTML gerado dinamicamente
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Executa ao carregar a página e configura auto-refresh a cada 30 segundos
    window.onload = () => {
      carregarMembros();
      setInterval(carregarMembros, 30000);
    };
  </script>
</body>
</html>
