<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar CRM: Profissionais Open to Work</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#fffff3;
    --panel:#ffffff;
    --text:#0a303d;
    --muted:#718289;
    --accent:#be8f63;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  header {
    background: var(--panel);
    padding: 40px 20px;
    text-align: center;
    border-bottom: 1px solid #e4ddc8;
  }
  h1 {
    margin: 0 0 10px 0;
    font-size: 32px;
    font-weight: 700;
  }
  .header-links {
    margin: 20px 0;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .header-links a {
    color: #1a56db;
    text-decoration: none;
    font-weight: 600;
    font-size: 13px;
  }
  #loginBtn {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #1e3a8a;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-weight: 600;
    cursor: pointer;
    font-size: 12px;
    z-index: 9999;
    box-shadow: 0 2px 8px rgba(30,58,140,0.3);
    letter-spacing: 0.05em;
  }
  .container {
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 20px;
  }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin: 20px 0;
  }
  .stat {
    background: var(--panel);
    padding: 24px;
    border-radius: 12px;
    border: 1px solid #e4ddc8;
  }
  .stat .num {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
  }
  .stat .label {
    font-size: 12px;
    color: var(--muted);
    margin-top: 8px;
  }
  .tab-nav {
    display: flex;
    gap: 8px;
    margin: 30px 0;
    flex-wrap: wrap;
  }
  .tab-btn {
    padding: 10px 16px;
    border: 1px solid #e4ddc8;
    background: white;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 12px;
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .page { display: none; }
  .page.active { display: block; }
</style>
</head>
<body>

<header>
  <h1>Radar CRM</h1>
  <p>Profissionais Open to Work & Salários da Comunidade</p>
  <div class="header-links">
    <a href="https://chat.whatsapp.com/By6Zdhf3QDrGNJ5tJnCqvf" target="_blank">CRM Academy (WhatsApp)</a>
    <span>·</span>
    <a href="https://chat.whatsapp.com/GPJ5Pti7gVd5m6BuJmhewf" target="_blank">Mulheres de CRM (WhatsApp)</a>
  </div>
</header>

<button id="loginBtn" onclick="openLoginModal()">ACESSO</button>

<div class="container">
  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('dashboard')">Dashboard</button>
    <button class="tab-btn" onclick="switchTab('profissionais')">Profissionais Open to Work</button>
    <button class="tab-btn" onclick="switchTab('cargos')">Cargos & Salários</button>
    <button class="tab-btn" onclick="switchTab('comunidade')">Comunidades</button>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="page active">
    <h2>Menu Executivo</h2>
    <div class="stat-grid">
      <div class="stat">
        <div class="num">6.000+</div>
        <div class="label">Membros ativos</div>
      </div>
      <div class="stat">
        <div class="num">2</div>
        <div class="label">Comunidades fundadas</div>
      </div>
      <div class="stat">
        <div class="num" id="dashProfissionais">228</div>
        <div class="label">Profissionais open to work</div>
      </div>
      <div class="stat">
        <div class="num" id="dashCargos">507</div>
        <div class="label">Cargos & salários</div>
      </div>
    </div>
  </div>

  <!-- PROFISSIONAIS -->
  <div id="profissionais" class="page">
    <h2>Profissionais Open to Work</h2>
    <div id="profList"></div>
  </div>

  <!-- CARGOS -->
  <div id="cargos" class="page">
    <h2>Cargos & Salários</h2>
    <div id="cargoList"></div>
  </div>

  <!-- COMUNIDADE -->
  <div id="comunidade" class="page">
    <h2>Diretório de Membros</h2>
    <div id="membroList"></div>
  </div>
</div>

<script>
// ============ SUPABASE ============
const SUPABASE_URL = "https://rwkbpafpniwzvlkfngag.supabase.co";
const SUPABASE_KEY = "sb_publishable_41a2jzlzwZgFrdMJ6UpDXQ_jysf69_C";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ============ LOGIN ============
let isAdminLoggedIn = false;
let currentUserEmail = null;

function checkAdminLogin(){
  const stored = localStorage.getItem('userLogin');
  const email = localStorage.getItem('userEmail');
  if(stored === 'true' && email){
    isAdminLoggedIn = true;
    currentUserEmail = email;
  }
}

async function loginAdmin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  const errorEl = document.getElementById('loginError');
  
  if(!email || !password){
    errorEl.textContent = 'Preencha email e senha.';
    return;
  }
  
  try{
    const {data, error} = await sb.from('usuarios_acesso').select('*').eq('email', email).maybeSingle();
    
    if(error || !data){
      errorEl.textContent = 'Email ou senha inválidos.';
      return;
    }
    
    if(data.senha !== password){
      errorEl.textContent = 'Email ou senha inválidos.';
      return;
    }
    
    isAdminLoggedIn = (data.role === 'admin');
    currentUserEmail = email;
    
    localStorage.setItem('userLogin', 'true');
    localStorage.setItem('userEmail', email);
    
    document.getElementById('loginModalOverlay').remove();
    alert('✅ Bem-vindo!');
    location.reload();
  }catch(e){
    errorEl.textContent = 'Erro ao conectar.';
  }
}

function logoutAdmin(){
  isAdminLoggedIn = false;
  currentUserEmail = null;
  localStorage.removeItem('userLogin');
  localStorage.removeItem('userEmail');
  alert('Logout realizado.');
  location.reload();
}

function openLoginModal(){
  const html = `
    <div style="position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:10000;" id="loginModalOverlay">
      <div style="background:white; padding:30px; border-radius:12px; max-width:400px; width:90%;">
        <h2>Acessar Painel</h2>
        <p>Digite suas credenciais</p>
        
        <label style="display:block; margin:10px 0;">Email</label>
        <input id="loginEmail" type="email" placeholder="seu@email.com" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; margin-bottom:10px;">
        
        <label style="display:block; margin:10px 0;">Senha</label>
        <input id="loginPassword" type="password" placeholder="••••••••" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; margin-bottom:10px;">
        
        <div id="loginError" style="color:red; font-size:12px; margin-bottom:12px;"></div>
        
        <div style="display:flex; gap:10px;">
          <button onclick="document.getElementById('loginModalOverlay').remove()" style="flex:1; padding:10px; border:1px solid #ccc; background:white; border-radius:6px; cursor:pointer;">Cancelar</button>
          <button onclick="loginAdmin()" style="flex:1; padding:10px; background:#1e3a8a; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:600;">Entrar</button>
        </div>
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', html);
}

// ============ UI ============
function switchTab(tab){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  
  document.getElementById(tab).classList.add('active');
  event.target.classList.add('active');
  
  if(tab === 'profissionais') loadProfissionais();
  if(tab === 'cargos') loadCargos();
  if(tab === 'comunidade') loadMembros();
}

async function loadProfissionais(){
  try{
    const {data} = await sb.from('profissionais_open_to_work').select('*').limit(50);
    let html = '';
    data.forEach(p => {
      html += `
        <div style="background:white; padding:16px; border-radius:8px; margin:10px 0; border:1px solid #e4ddc8;">
          <strong>${p.nome}</strong><br>
          ${p.senioridade} • ${p.localizacao} • ${p.condicao_trabalho}<br>
          <small style="color:#718289;">${p.ferramentas}</small>
        </div>
      `;
    });
    document.getElementById('profList').innerHTML = html || '<p>Nenhum profissional encontrado</p>';
  }catch(e){
    console.error(e);
  }
}

async function loadCargos(){
  try{
    const {data} = await sb.from('vagas_crm').select('*').limit(50);
    let html = '';
    data.forEach(c => {
      html += `
        <div style="background:white; padding:16px; border-radius:8px; margin:10px 0; border:1px solid #e4ddc8;">
          <strong>${c.cargo}</strong><br>
          ${c.empresa || 'Empresa'} • ${c.nivel} • ${c.regiao}<br>
          <small style="color:#718289;">R$ ${c.salario?.toLocaleString('pt-BR') || 'N/A'} • ${c.tipo_contrato}</small>
        </div>
      `;
    });
    document.getElementById('cargoList').innerHTML = html || '<p>Nenhum cargo encontrado</p>';
  }catch(e){
    console.error(e);
  }
}

async function loadMembros(){
  try{
    const {data} = await sb.from('membros_comunidade').select('*').limit(50);
    let html = '';
    data.forEach(m => {
      html += `
        <div style="background:white; padding:16px; border-radius:8px; margin:10px 0; border:1px solid #e4ddc8;">
          <strong>${m.nome}</strong><br>
          ${m.comunidade || 'Comunidade'} • ${m.especialidade || 'N/A'}<br>
          <small style="color:#718289;">${m.bio || ''}</small>
        </div>
      `;
    });
    document.getElementById('membroList').innerHTML = html || '<p>Nenhum membro encontrado</p>';
  }catch(e){
    console.error(e);
  }
}

async function loadDashboardStats(){
  try{
    const {count: profCount} = await sb.from('profissionais_open_to_work').select('*', {count: 'exact', head: true});
    const {count: cargoCount} = await sb.from('vagas_crm').select('*', {count: 'exact', head: true});
    
    if(profCount) document.getElementById('dashProfissionais').textContent = profCount;
    if(cargoCount) document.getElementById('dashCargos').textContent = cargoCount;
  }catch(e){
    console.warn('Erro ao carregar stats');
  }
}

// ============ INICIALIZAR ============
setTimeout(() => {
  checkAdminLogin();
  loadDashboardStats();
}, 100);
</script>

</body>
</html>
