<body class="bg-gradient-to-br from-slate-50 to-slate-100">

  <script>
    // ============================================================================
    // CONFIGURAÇÃO SUPABASE
    // ============================================================================
    const SUPABASE_URL = 'https://rwkbpafpniwzvlkfngag.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ3a2JwYWZwbml3enZsa2ZuZ2FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjY1Njk2NzcsImV4cCI6MjA0MjE0NTY3N30.qK6FgH1mSLw0_l2-Ea8XvVslPBmpC7-8Fn-Wx6l0vSU';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ============================================================================
    // FUNÇÕES DE SEGURANÇA
    // ============================================================================
    function sanitizeInput(str, maxLen = 500) {
      return String(str)
        .replace(/<[^>]*>/g, '')
        .replace(/javascript:/gi, '')
        .replace(/on\w+\s*=/gi, '')
        .replace(/script/gi, '')
        .trim()
        .slice(0, maxLen);
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = String(str);
      return div.innerHTML;
    }

    // ============================================================================
    // ESTADO GLOBAL
    // ============================================================================
    let estadoApp = {
      usuarioLogado: null,
      perfil: null,
      vagas: [],
      vagasSalvas: [],
      vagasMatches: [],
      carregando: true,
      abaSelecionada: 'dashboard'
    };

    // ============================================================================
    // AUTENTICAÇÃO
    // ============================================================================
    function obterEmailLogado() {
      return sessionStorage.getItem('email_usuario_logado');
    }

    function fazerLogout() {
      sessionStorage.removeItem('email_usuario_logado');
      window.location.href = '/index.html';
    }

    async function verificarAutenticacao() {
      const email = obterEmailLogado();

      if (!email) {
        renderizarTelaLogin();
        return false;
      }

      estadoApp.usuarioLogado = email;
      return true;
    }

    // ============================================================================
    // CARREGAMENTO DE DADOS
    // ============================================================================
    async function carregarPerfil() {
      try {
        const email = estadoApp.usuarioLogado;
        const { data, error } = await supabase
          .from('diretorio_membros')
          .select('*')
          .eq('email', email)
          .single();

        if (error) throw error;
        estadoApp.perfil = data;
      } catch (erro) {
        console.error('Erro ao carregar perfil:', erro);
        estadoApp.perfil = null;
      }
    }

    async function carregarVagas() {
      try {
        const { data, error } = await supabase
          .from('vagas_crm')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;
        estadoApp.vagas = data || [];
      } catch (erro) {
        console.error('Erro ao carregar vagas:', erro);
        estadoApp.vagas = [];
      }
    }

    async function carregarVagasSalvas() {
      try {
        const email = estadoApp.usuarioLogado;
        const { data, error } = await supabase
          .from('vagas_salvas')
          .select('*')
          .eq('email_usuario', email)
          .order('data_salvamento', { ascending: false });

        if (error) throw error;
        estadoApp.vagasSalvas = data || [];
      } catch (erro) {
        console.error('Erro ao carregar vagas salvas:', erro);
        estadoApp.vagasSalvas = [];
      }
    }

    // ============================================================================
    // BOT DE MATCHING
    // ============================================================================
    function calcularScoreMatching(perfil, vaga) {
      if (!perfil || !vaga) return 0;

      let score = 0;
      const maxScore = 100;

      // Score por ferramentas (40%)
      if (perfil.ferramentas && vaga.requisitos) {
        const ferramentasPerfil = perfil.ferramentas.toLowerCase().split(',').map(f => f.trim());
        const ferramentasVaga = vaga.requisitos.toLowerCase().split(',').map(f => f.trim());

        const matchesFerramenta = ferramentasPerfil.filter(f =>
          ferramentasVaga.some(fv => fv.includes(f) || f.includes(fv))
        ).length;

        score += (matchesFerramenta / ferramentasVaga.length) * 40;
      }

      // Score por senioridade (30%)
      if (perfil.senioridade && vaga.nivel) {
        const nivelPerfil = perfil.senioridade.toLowerCase();
        const nivelVaga = vaga.nivel.toLowerCase();

        const hierarquia = { 'júnior': 1, 'pleno': 2, 'sênior': 3, 'liderança': 4, 'c-level': 5 };
        const ptPerfil = hierarquia[nivelPerfil] || 0;
        const ptVaga = hierarquia[nivelVaga] || 0;

        if (ptPerfil >= ptVaga) {
          score += 30;
        } else if (Math.abs(ptPerfil - ptVaga) === 1) {
          score += 15;
        }
      }

      // Score por área (30%)
      if (perfil.area && vaga.area) {
        if (perfil.area.toLowerCase() === vaga.area.toLowerCase()) {
          score += 30;
        } else if (vaga.area.toLowerCase().includes(perfil.area.toLowerCase())) {
          score += 15;
        }
      }

      return Math.round(score);
    }

    function gerarVagasMatches() {
      if (!estadoApp.perfil || !estadoApp.vagas.length) {
        estadoApp.vagasMatches = [];
        return;
      }

      estadoApp.vagasMatches = estadoApp.vagas
        .map(vaga => ({
          ...vaga,
          scoreMatching: calcularScoreMatching(estadoApp.perfil, vaga)
        }))
        .filter(vaga => vaga.scoreMatching > 0)
        .sort((a, b) => b.scoreMatching - a.scoreMatching)
        .slice(0, 5);
    }

    // ============================================================================
    // GERENCIAR VAGAS SALVAS
    // ============================================================================
    async function salvarVaga(vagaId) {
      try {
        const email = estadoApp.usuarioLogado;
        const { data, error } = await supabase
          .from('vagas_salvas')
          .insert([{ email_usuario: email, vaga_id: vagaId }])
          .select();

        if (error) throw error;

        await carregarVagasSalvas();
        renderizar();
      } catch (erro) {
        if (erro.message?.includes('duplicate')) {
          alert('⚠️ Esta vaga já está salva!');
        } else {
          alert('❌ Erro ao salvar vaga: ' + erro.message);
        }
      }
    }

    async function removerVagaSalva(vagaId) {
      try {
        const email = estadoApp.usuarioLogado;
        const { error } = await supabase
          .from('vagas_salvas')
          .delete()
          .eq('email_usuario', email)
          .eq('vaga_id', vagaId);

        if (error) throw error;

        await carregarVagasSalvas();
        renderizar();
      } catch (erro) {
        alert('❌ Erro ao remover vaga: ' + erro.message);
      }
    }

    function vagaEstaSalva(vagaId) {
      return estadoApp.vagasSalvas.some(v => v.vaga_id === vagaId);
    }

              <button
                onclick="estadoApp.abaSelecionada='vagas-para-voce'; renderizar()"
                class="inline-block bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-6 rounded-lg transition"
              >
                Explorar Vagas →
              </button>
            </div>
          `}
        </div>
      `;
    }

    function renderizarEditarPerfil() {
      const perfil = estadoApp.perfil || {};
      return `
        <div class="max-w-2xl mx-auto px-6 py-8">
          <h1 class="text-3xl font-bold text-slate-800 mb-6">✏️ Editar Seu Perfil</h1>

          <div class="bg-white rounded-lg shadow-md p-6">
            <div class="space-y-4">
              <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Nome</label>
                <p class="text-slate-800">${escapeHtml(perfil.nome || 'N/A')}</p>
                <p class="text-xs text-slate-500 mt-1">Para atualizar, acesse /diretorio-membros.html</p>
              </div>

              <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Email</label>
                <p class="text-slate-800">${escapeHtml(perfil.email || 'N/A')}</p>
              </div>

              <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Área de Atuação</label>
                <p class="text-slate-800">${escapeHtml(perfil.area || 'N/A')}</p>
              </div>

              <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Senioridade</label>
                <p class="text-slate-800">${escapeHtml(perfil.senioridade || 'N/A')}</p>
              </div>

              <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Ferramentas</label>
                <p class="text-slate-800 text-sm">${escapeHtml(perfil.ferramentas || 'N/A')}</p>
              </div>

              <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">LinkedIn</label>
                ${perfil.linkedin ? `
                  <a href="${escapeHtml(perfil.linkedin)}" target="_blank" class="text-indigo-600 hover:text-indigo-700 font-semibold">
                    Abrir LinkedIn →
                  </a>
                ` : `
                  <p class="text-slate-600">Não informado</p>
                `}
              </div>
            </div>

            <div class="mt-6 p-4 bg-blue-50 rounded-lg border border-blue-200">
              <p class="text-blue-800 text-sm">
                <strong>💡 Dica:</strong> Para atualizar suas informações de perfil, acesse a página
                <a href="/diretorio-membros.html" class="font-semibold hover:underline">Diretório de Membros</a>
                e refaça seu cadastro.
              </p>
            </div>
          </div>
        </div>
      `;
    }

    function renderizar() {
      const app = document.getElementById('app');
      let conteudo = renderizarHeader();

      switch (estadoApp.abaSelecionada) {
        case 'vagas-para-voce':
          conteudo += renderizarVagasParaVoce();
          break;
        case 'vagas-salvas':
          conteudo += renderizarVagasSalvas();
          break;
        case 'editar-perfil':
          conteudo += renderizarEditarPerfil();
          break;
        default:
          conteudo += renderizarDashboard();
      }

      app.innerHTML = conteudo;
    }

    // ============================================================================
    // INICIALIZAÇÃO
    // ============================================================================
    async function inicializar() {
      const autenticado = await verificarAutenticacao();

      if (!autenticado) {
        return;
      }

      try {
        await Promise.all([
          carregarPerfil(),
          carregarVagas(),
          carregarVagasSalvas()
        ]);

        gerarVagasMatches();
        estadoApp.carregando = false;
        renderizar();

        // Auto-refresh a cada 60 segundos
        setInterval(() => {
          carregarVagas().then(() => {
            gerarVagasMatches();
            renderizar();
          });
        }, 60000);

      } catch (erro) {
        console.error('Erro ao inicializar:', erro);
        alert('❌ Erro ao carregar dados. Recarregue a página.');
      }
    }

    // Iniciar quando página carregar
    window.addEventListener('DOMContentLoaded', inicializar);
  </script>
</body>
</html>
